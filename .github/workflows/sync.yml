name: 同步Docker镜像到阿里云

on:
  workflow_dispatch:
    inputs:
      image:
        description: '要同步的镜像(例如: nginx:latest)'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取Docker镜像
        run: |
          echo "正在拉取镜像: ${{ github.event.inputs.image }}"
          docker pull ${{ github.event.inputs.image }}
      
      - name: 登录阿里云镜像仓库
        run: |
          echo "正在登录阿里云..."
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login \
            --username=${{ secrets.ALIYUN_USERNAME }} \
            --password-stdin \
            ${{ secrets.ALIYUN_REGISTRY }}
      
      - name: 推送到阿里云
        run: |
          # 提取镜像名称和标签
          SOURCE="${{ github.event.inputs.image }}"
          IMAGE_NAME=$(echo $SOURCE | cut -d: -f1 | sed 's/.*\///')
          IMAGE_TAG=$(echo $SOURCE | cut -d: -f2)
          
          # 如果没有标签,默认使用latest
          if [ "$IMAGE_TAG" = "$SOURCE" ]; then
            IMAGE_TAG="latest"
          fi
          
          # 构建目标镜像地址
          TARGET="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${IMAGE_NAME}:${IMAGE_TAG}"
          
          echo "正在打标签: $SOURCE → $TARGET"
          docker tag $SOURCE $TARGET
          
          echo "正在推送镜像到阿里云..."
          docker push $TARGET
          
          echo "✅ 同步成功!"
          echo "可以使用以下命令拉取镜像:"
          echo "docker pull $TARGET"
