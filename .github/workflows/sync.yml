name: 同步Docker镜像到阿里云

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
     
          - source: "mysql:8.0.30"
            target: "mysql:8.0.30"
            
        # 多个镜像往下添加即可
        #  - source: "nginx:latest"
        #    target: "nginx"

    
    steps:
      - name: 拉取源镜像
        id: pull
        continue-on-error: true
        run: |
          echo "正在拉取镜像: ${{ matrix.source }}"
          docker pull ${{ matrix.source }}
      
      - name: 检查拉取结果
        if: steps.pull.outcome == 'failure'
        run: |
          echo "❌ 错误: 镜像 ${{ matrix.source }} 不存在或无法访问"
          exit 1
      - name: 登录阿里云
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login \
            ${{ secrets.ALIYUN_REGISTRY }} \
            --username=${{ secrets.ALIYUN_USERNAME }} \
            --password-stdin
            
      - name: 推送到阿里云
        run: |
          TARGET="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ matrix.target }}"
          docker tag ${{ matrix.source }} $TARGET
          docker push $TARGET
          echo "✅ 成功: ${{ matrix.source }} → $TARGET"
