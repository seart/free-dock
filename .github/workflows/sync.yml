name: 同步Docker镜像到阿里云

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: "nginx:latest"
            target: "nginx"
          - source: "mysql:8.0"
            target: "mysql"
    
    steps:
      - name: 拉取源镜像
        run: docker pull ${{ matrix.source }}
      
      - name: 登录阿里云
        run: |
          docker login \
            -u ${{ secrets.ALIYUN_USERNAME }} \
            -p ${{ secrets.ALIYUN_PASSWORD }} \
            ${{ secrets.ALIYUN_REGISTRY }}
      
      - name: 推送到阿里云
        run: |
          TARGET="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ matrix.target }}"
          docker tag ${{ matrix.source }} $TARGET
          docker push $TARGET
          echo "✅ 成功: ${{ matrix.source }} → $TARGET"
